  :root {
    --canvas: #F2F2F2;
    --ink: #2D3142;
    --slate-950: #1A1C25;
    --gradient-spectrum: linear-gradient(90deg,
      #05A6FF 0%, #2380FD 12%, #4F49FB 24%, #7B12F9 36%,
      #8E01EC 46%, #C2068E 58%, #E40950 68%, #FF191E 78%,
      #FF5416 87%, #FF8F0E 94%, #FFAC0B 100%);
    --ease-standard: cubic-bezier(.4, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas);
    overflow: hidden;
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--ink);
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fade { position: fixed; inset: 0; background: #070A1A; pointer-events: none; }

  #lockup {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  #scaler { display: flex; align-items: center; flex: none; transform-origin: center; }
  #mark { display: block; flex: none; }
  #word { flex: none; overflow: hidden; width: 0; }
  #wordSvg { display: block; }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 6px;
    background: var(--gradient-spectrum);
    transform-origin: left center;
    transform: scaleX(0);
  }

  #replay {
    position: fixed; right: 20px; bottom: 26px;
    display: inline-flex; align-items: center; gap: 8px;
    font: 600 14px/1 "Manrope", system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
    border: 1px solid rgba(45, 49, 66, .12);
    border-radius: 999px;
    padding: 10px 16px 10px 13px;
    box-shadow: 0 1px 3px rgba(45,49,66,.08), 0 1px 2px rgba(45,49,66,.05);
    cursor: pointer;
    opacity: 0; transform: translateY(6px);
    pointer-events: none;
    transition: opacity .3s var(--ease-standard), transform .3s var(--ease-standard), background .15s var(--ease-standard);
  }
  #replay.show { opacity: 1; transform: none; pointer-events: auto; }
  #replay:hover { background: #F6F7F9; }
  #replay:active { transform: scale(.985) translateY(.5px); }
  #replay:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(123, 18, 249, .35); }
  #replay svg { width: 16px; height: 16px; }
  @media (max-width: 520px) { #replay { right: 16px; bottom: 22px; } }
</style>
</head>

      <path id="markPath" fill="url(#gm)" fill-rule="evenodd"/>
    </svg>

  // ---------- Mark geometry (measured from the official lockup, outer radius = 1) ----------
  const G = {
    hw: 0.7995, hh: 0.500,   // screen half-size at the centre lines
    bx: 0.018, by: 0.042,    // outward bulge of the screen edges
    cr: 0.093,               // corner radius
    inner: 0.404             // inner sphere radius
  };
  function holeSDF(x, y) {
    const hw = G.hw - G.bx * Math.min(1, (y / G.hh) ** 2);
    const hh = G.hh - G.by * Math.min(1, (x / G.hw) ** 2);
    const qx = Math.abs(x) - hw + G.cr, qy = Math.abs(y) - hh + G.cr;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - G.cr;
  }

  // ---------- Shaders ----------
  const f4 = v => v.toFixed(4);
  const common = `
    uniform vec3 uCam;
    uniform vec3 uBg;
    uniform float uFlat;
    uniform vec3 uDeep, uMidA, uMidB, uNearA, uNearB, uGlowCol;
    uniform float uGlow, uGlowFall;
    varying vec3 vPos;
    const vec3 C_CYAN   = vec3(0.020, 0.651, 1.000);  // #05A6FF
    const vec3 C_MARK2  = vec3(0.086, 0.569, 0.996);  // #1691FE
    const vec3 C_BLUE   = vec3(0.137, 0.502, 0.992);  // #2380FD
    const vec3 C_INDIGO = vec3(0.310, 0.286, 0.984);  // #4F49FB
    const vec3 C_VIOLET = vec3(0.482, 0.071, 0.976);  // #7B12F9
    const vec3 C_ICE    = vec3(0.62, 0.86, 1.0);
    // flat colour of the mark, left → right
    vec3 logoCol(float x) { return mix(C_CYAN, C_MARK2, clamp(x * 0.5 + 0.5, 0.0, 1.0)); }
    // richer ramp for the 3D shading
    vec3 ramp(float t) {
      t = clamp(t, 0.0, 1.0);
      return t < 0.5 ? mix(C_CYAN, C_BLUE, t * 2.0) : mix(C_BLUE, C_INDIGO, t * 2.0 - 1.0);
    }
    const vec3 L = normalize(vec3(-0.55, 0.65, 0.85));
    vec3 lit(vec3 N, vec3 V, vec3 p) {
      vec3 base = ramp(p.x * 0.42 + 0.5 - p.y * 0.18);
      float diff = max(dot(N, L), 0.0);
      vec3 H = normalize(L + V);
      float spec = pow(max(dot(N, H), 0.0), 60.0);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 c = base * (0.36 + 0.76 * diff);
      c = mix(c, C_ICE, fres * 0.40);
      c += vec3(1.0) * spec * 0.5;
      return c;
    }
  `;
  const vert = `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const outerFrag = common + `
    float holeSDF(vec2 p) {
      float hw = ${f4(G.hw)} - ${f4(G.bx)} * min(1.0, pow(p.y / ${f4(G.hh)}, 2.0));
      float hh = ${f4(G.hh)} - ${f4(G.by)} * min(1.0, pow(p.x / ${f4(G.hw)}, 2.0));
      vec2 q = abs(p) - vec2(hw, hh) + ${f4(G.cr)};
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - ${f4(G.cr)};
    }
    void main() {
      vec3 p = vPos;
      float s = holeSDF(p.xy);
      if (p.z > 0.0 && s < 0.0) discard;
      vec3 n = normalize(p);
      vec3 V = normalize(uCam - p);
      bool front = dot(n, uCam - p) > 0.0;
      vec3 col;

        col = mix(uDeep, mid, smoothstep(0.0, 0.6, toward));
        col = mix(col, near, smoothstep(0.55, 1.0, toward));

  const FOV_END = 2.5;                       // near-orthographic finish
  const WORD_RATIO = 1491 / 384;             // wordmark width relative to mark height
  let W = 1, H = 1, markR = 100, D_END = 50, lockScale = 1;
  const lockup = document.getElementById('lockup');
  const scaler = document.getElementById('scaler');
  const mark = document.getElementById('mark');
  const word = document.getElementById('word');

    W = window.innerWidth; H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const tanHalf = Math.tan(THREE.MathUtils.degToRad(FOV_END / 2));

  // ---------- Timeline ----------
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const inOutQuart = x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2;
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const lerp = (a, b, t) => a + (b - a) * t;

  const T = {
    fadeIn: [0, 1.0],
    orbit: [0.2, 5.0],
    exit: [4.3, 8.6],
    flat: [7.9, 9.0],
    swap: [8.95, 9.25],
    lock: [9.4, 10.7],
    bar: [9.7, 10.8],
    end: 11.0
  };
  const R_IN = 0.9, FOV_IN = 80;

  const fade = document.getElementById('fade');
  const bar = document.getElementById('bar');
  const replay = document.getElementById('replay');
  let start = performance.now();
  let FREEZE = (q => q === null ? null : parseFloat(q))(new URLSearchParams(location.search).get('t'));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now) {
    const t = FREEZE !== null ? FREEZE : (now - start) / 1000;

    // camera: orbit round the inner sphere, then back out through the screen
    const o = inOutCubic(seg(t, ...T.orbit));
    const theta = lerp(Math.PI * 1.08, 0, o);
    const phi = lerp(0.42, 0, inOutCubic(seg(t, T.orbit[0], T.orbit[1] + 0.6)));
    const e = inOutQuart(seg(t, ...T.exit));
    const r = Math.exp(lerp(Math.log(R_IN), Math.log(D_END), e));
    camera.fov = lerp(FOV_IN, FOV_END, Math.sqrt(e));
    camera.near = Math.max(0.005, (r - 1.3) * 0.9);
    camera.far = r + 2;
    camera.position.set(r * Math.sin(theta) * Math.cos(phi), r * Math.sin(phi), r * Math.cos(theta) * Math.cos(phi));
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    shared.uCam.value.copy(camera.position);
    shared.uFlat.value = inOutCubic(seg(t, ...T.flat));

    fade.style.opacity = 1 - outCubic(seg(t, ...T.fadeIn));

    const sw = seg(t, ...T.swap);
    canvas.style.opacity = 1 - sw;
    lockup.style.opacity = sw;

    // lockup: the wordmark opens beside the mark and the whole thing settles to fit
    const l = inOutCubic(seg(t, ...T.lock));
    word.style.width = (2 * markR * WORD_RATIO * l) + 'px';
    wordSvg.style.transform = `translateX(${(1 - l) * -24}px)`;
    word.style.opacity = Math.min(1, l * 1.6);
    scaler.style.transform = `scale(${lerp(1, lockScale, l)})`;

    bar.style.transform = `scaleX(${outCubic(seg(t, ...T.bar))})`;
    replay.classList.toggle('show', t > T.end);

    if (sw < 1) renderer.render(scene, camera);
    if ((FREEZE === null && t < T.end + 0.1) || dirty) {
      dirty = false;
      requestAnimationFrame(frame);
    } else running = false;
  }

  let running = false, dirty = false;
  function run() { if (!running) { running = true; requestAnimationFrame(frame); } else dirty = true; }
  function restart() { FREEZE = null; start = performance.now(); run(); }

  window.addEventListener('resize', () => { layout(); dirty = true; run(); });
  replay.addEventListener('click', restart);
  window.addEventListener('keydown', ev => { if (ev.key === 'r' || ev.key === 'R') restart(); });
  window.__seek = t => { FREEZE = t; frame(performance.now()); };

  layout();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    start = performance.now() - (reduce ? T.end * 1000 : 0);
    run();
  });
})();
</script>
</body>
</html>
